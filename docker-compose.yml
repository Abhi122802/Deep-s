services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: deeps-cake-shop-backend
    restart: unless-stopped
    # Port mapping removed from default configuration so normal traffic flows through Nginx.
    # For direct local API debugging without Nginx, uncomment the loopback-only binding below:
    # ports:
    #   - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/deeps_cake_shop
      - FRONTEND_URL=http://localhost,http://localhost:80
      # Required JWT secret substitution: Compose refuses to start if JWT_SECRET is unset or empty.
      # In production, JWT_SECRET must be at least 32 characters long and not a development default.
      # Provide via your orchestrator environment or a gitignored .env file.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required (must be at least 32 characters in production)}
      - TRUST_PROXY=1
      - NOTIFICATION_MODE=mock
      - NOTIFICATION_EMAIL_PROVIDER=mock
      - NOTIFICATION_MESSAGING_PROVIDER=mock
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Persistent named volume for fallback disk uploads.
      # PERMISSION NOTE: The backend runs as non-root 'USER node' (UID 1000). Named volumes
      # preserve container permissions. If using a Linux host bind mount (e.g., ./uploads:/app/uploads)
      # instead of a named volume, ensure the host directory is writable by UID 1000 (chown -R 1000:1000 ./uploads).
      - cake_uploads:/app/uploads
    networks:
      - deeps-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: deeps-cake-shop-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - deeps-network

  mongodb:
    image: mongo:7.0
    container_name: deeps-cake-shop-mongodb
    restart: unless-stopped
    # Port mapping removed from default configuration so MongoDB is accessible ONLY within deeps-network.
    # NEVER expose unauthenticated MongoDB to 0.0.0.0. For local GUI/CLI inspection, use loopback:
    # ports:
    #   - "127.0.0.1:27017:27017"
    # PRODUCTION SECURITY NOTE:
    # For production deployments, either connect to a managed cluster (e.g. MongoDB Atlas via MONGODB_URI)
    # or enable internal authentication using MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD.
    volumes:
      - mongo_data:/data/db
    networks:
      - deeps-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  cake_uploads:

networks:
  deeps-network:
    driver: bridge
