name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code Quality & Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Run frontend linter (oxlint)
        run: npm run lint

      - name: Run storefront dynamic catalog tests
        run: ./server/node_modules/.bin/tsx --test tests/cakeService.test.ts

      - name: Build frontend production bundle
        run: npm run build

      - name: Run backend API test suite
        run: npm test --prefix server
        env:
          NODE_ENV: test
          NOTIFICATION_MODE: mock
          NOTIFICATION_EMAIL_PROVIDER: mock
          NOTIFICATION_MESSAGING_PROVIDER: mock
          JWT_SECRET: deeps_cake_shop_super_secret_jwt_key_2026_dev_env

  docker-build-validation:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build --tag deeps-cake-shop-backend:ci ./server

      - name: Build frontend Docker image
        run: docker build --tag deeps-cake-shop-frontend:ci --build-arg VITE_API_BASE_URL=/api .
